[project]
name = "slither-bot"
version = "0.1.0"
description = "Modular browser-control MVP with a local test fixture"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["playwright>=1.50,<2", "numpy>=2,<3"]

[project.optional-dependencies]
ml = ["torch>=2.6,<3"]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.9,<1", "mypy>=1.14,<2"]

[project.scripts]
slither-bot = "slither_bot.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/slither_bot"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: requires installed Playwright Chromium; opt in with RUN_BROWSER_TESTS=1"]
